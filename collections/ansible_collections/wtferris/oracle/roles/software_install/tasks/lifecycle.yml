---
- name: Run package installation transaction
  block:
    - name: Fetch desired software archive
      wtferris.oracle.fetch_archive:
        source_url: "{{ package_url }}"
        installation_path: >-
          {{ software_fetch_installation_path
             if software_fetch_installation_path | length > 0
             else software_installation_directory | dirname }}
        md5sum: "{{ package_md5sum }}"
        force: "{{ software_fetch_force }}"
        lock_timeout: "{{ software_fetch_lock_timeout }}"
      register: package

    - name: Validate fetched software archive
      ansible.builtin.assert:
        that:
          - not package.failed | default(true) | bool
          - package.md5sum | default('') | lower == package_md5sum
          - package.unpack_directory is defined
          - package.unpack_directory | length > 0
          - package.temporary_directory is defined
          - package.contents is defined
        fail_msg: fetch_archive returned an incomplete or mismatched package result.

    - name: Inspect fetched unpack directory
      ansible.builtin.stat:
        path: "{{ package.unpack_directory }}"
      register: software_unpack_directory_stat

    - name: Validate fetched unpack directory exists
      ansible.builtin.assert:
        that:
          - software_unpack_directory_stat.stat.exists | default(false) | bool
          - software_unpack_directory_stat.stat.isdir | default(false) | bool
        fail_msg: >-
          fetch_archive unpack directory {{ package.unpack_directory }} does
          not exist or is not a directory.

    - name: Run package-specific installer
      ansible.builtin.include_tasks: "{{ software_package.installer_tasks_file }}"

    - name: Verify installed package
      ansible.builtin.include_tasks: >-
        {{ software_package.verifier_tasks_file | default('verifiers/default.yml', true) }}

    - name: Commit software registration symlink
      ansible.builtin.file:
        src: "{{ software_installation_directory }}"
        dest: "{{ software_registration_path }}"
        state: link
        force: false
      register: software_registration_commit

    - name: Return software installation result
      ansible.builtin.set_fact:
        software_package_installed: true
        software_install_result:
          changed: true
          installed: true
          package_name: "{{ software_package.name }}"
          package_metadata: "{{ software_resolved_package }}"
          md5sum: "{{ package.md5sum }}"
          installation_directory: "{{ software_installation_directory }}"
          registration_path: "{{ software_registration_path }}"
          package: "{{ package }}"
  always:
    - name: Inspect fetched software cache completion marker
      ansible.builtin.stat:
        path: "{{ package.temporary_directory }}/.complete"
        follow: false
      register: software_cleanup_marker
      failed_when: false
      when:
        - software_cleanup_temporary_directory | bool
        - package is defined
        - package.temporary_directory is defined
        - package.temporary_directory | length > 0

    - name: Validate fetched software cache cleanup paths
      ansible.builtin.assert:
        that:
          - package.unpack_directory is defined
          - package.unpack_directory | length > 0
          - package.unpack_directory == package.temporary_directory ~ '/extract'
          - package.unpack_directory | basename == 'extract'
          - software_cleanup_marker.stat.exists | default(false) | bool
          - software_cleanup_marker.stat.isreg | default(false) | bool
        fail_msg: >-
          Refusing cache cleanup because the paths do not match the expected
          temporary_directory/extract layout or .complete is not a regular file.
      register: software_cleanup_validation
      failed_when: false
      when:
        - software_cleanup_temporary_directory | bool
        - package is defined
        - package.temporary_directory is defined
        - package.temporary_directory | length > 0
        - software_cleanup_marker is defined
        - not software_cleanup_marker.skipped | default(false) | bool

    - name: Remove fetched software extract directory
      ansible.builtin.file:
        path: "{{ package.unpack_directory }}"
        state: absent
      register: software_cleanup_extract
      failed_when: false
      when:
        - software_cleanup_validation is defined
        - not software_cleanup_validation.failed | default(true) | bool

    - name: Remove fetched software completion marker
      ansible.builtin.file:
        path: "{{ package.temporary_directory }}/.complete"
        state: absent
      register: software_cleanup_complete
      failed_when: false
      when:
        - software_cleanup_extract is defined
        - not software_cleanup_extract.failed | default(true) | bool

    - name: Remove empty fetched software cache directory
      ansible.builtin.command:
        argv:
          - rmdir
          - "{{ package.temporary_directory }}"
      register: software_cleanup_directory
      changed_when: software_cleanup_directory.rc == 0
      failed_when: false
      when:
        - software_cleanup_complete is defined
        - not software_cleanup_complete.failed | default(true) | bool

    - name: Report software cache cleanup failure
      ansible.builtin.debug:
        msg: >-
          Cleanup of {{ package.temporary_directory | default('the fetched cache') }}
          was refused or incomplete. The original lifecycle result has been
          preserved; inspect the cache before removing it manually.
      when:
        - software_cleanup_temporary_directory | bool
        - >-
          (software_cleanup_validation is defined and
           software_cleanup_validation.failed | default(false) | bool) or
          (software_cleanup_extract is defined and
           software_cleanup_extract.failed | default(false) | bool) or
          (software_cleanup_complete is defined and
           software_cleanup_complete.failed | default(false) | bool) or
          (software_cleanup_directory is defined and
           software_cleanup_directory.rc | default(0) != 0)
