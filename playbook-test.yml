- name: Install software
  hosts: all
  roles:
    - role: wtferris.oracle.software_install
      vars:
        dbahub_url: https://dbahub.wtferris.net
        software_package:
          name: oracle_database
          installation_directory: /u01/product/oracle/linux-x64-19.8.0.0.200714-db
          installer_tasks_file: installers/publish_directory.yml
          verifier_tasks_file: verifiers/executable.yml
          verification_executable: /u01/product/oracle/linux-x64-19.8.0.0.200714-db/bin/oracle
          type: oracle-database
          release: 19.0.0.0
          package: linux-x64-19.8.0.0.200714-db.tar.gz

